# VFX SOTA Monitor — 피드 소스 설정
# 수정하면 다음 feed_crawler 실행부터 반영.

# ─── YouTube 채널 RSS (API 키 불필요) ───────────────────────
youtube_channels:
  - channel_id: "UCbfYPyITQ-7l4upoX8nvctg"   # Two Minute Papers
    name: "Two Minute Papers"
    tags: [ai, research, paper-review]
  - channel_id: "UCZXFjRct1LjJTtEcrm0ESdw"   # Corridor Crew (VFX)
    name: "Corridor Crew"
    tags: [vfx, production, tutorial]
  - channel_id: "UC-8TUQE_mZbKMLkNqOvRdSQ"   # Olivio Sarikas (AI art)
    name: "Olivio Sarikas"
    tags: [comfyui, ai-art, workflow]
  - channel_id: "UCaIh0gjaRCiJ_PsmEMxqung"   # Matt Wolfe (AI news)
    name: "Matt Wolfe"
    tags: [ai-news, tools]
  - channel_id: "UCWN3xxRkmTPphLLdxLO1Kbg"   # Latent Space (AI podcast)
    name: "Latent Space"
    tags: [ai, deep-dive, research]
max_per_channel: 5

# ─── X/Twitter 계정 (nitter RSS → Crawl4AI fallback) ───────
x_accounts:
  - handle: "_akhaliq"
    tags: [ai, paper, daily]
  - handle: "multimodalart"
    tags: [huggingface, demo, model]
  - handle: "aaborochin"
    tags: [comfyui, workflow]
  - handle: "jonstephens85"
    tags: [3dgs, gaussian-splatting]
max_per_account: 10

# ─── HuggingFace 트렌딩 (공식 API) ─────────────────────────
huggingface_trending:
  papers: true         # /api/daily_papers
  spaces: true         # /api/spaces?sort=trending
  max_papers: 10
  max_spaces: 10
  tags: [ai, model, demo]

# ─── PapersWithCode (RSS) ──────────────────────────────────
paperswithcode:
  rss_url: "https://paperswithcode.com/latest"
  max_items: 15
  tags: [paper, code, benchmark]

# ─── Crawl4AI 웹 검색 (기존 유지, 보조용) ──────────────────
crawl4ai_queries:
  - query: "comfyui workflow tutorial 2026"
    tags: [comfyui, workflow, tutorial]
    limit: 3
  - query: "gaussian splatting unreal engine production"
    tags: [3dgs, production]
    limit: 3
  - query: "nuke python vfx pipeline"
    tags: [nuke, vfx, pipeline]
    limit: 3

# ─── Reddit (기존 유지) ────────────────────────────────────
reddit:
  subreddits:
    - comfyui
    - StableDiffusion
    - vfx
    - aivideo
    - GaussianSplatting
    - animation
    - computervision
    - editors
  keywords:
    - comfyui
    - workflow
    - gaussian splatting
    - animation
    - ai video
    - lora
    - vfx
    - pipeline
    - tutorial
    - wan animate
  days_back: 3
  max_per_sub: 15
